[package]
name = "dvt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "dvt (disk view tree): a read-only terminal disk usage visualizer with treemap and list views"
authors = ["Andrew Imm"]
readme = "README.md"
keywords = ["disk-usage", "treemap", "tui", "du"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29"
notify = "8.2.0"
ratatui = "0.30.2"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
